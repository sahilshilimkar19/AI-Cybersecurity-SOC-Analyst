name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest

    # PostgreSQL + pgvector service for migration and database integration tests.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: soc_local_pw
          POSTGRES_DB: soc_analyst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soc -d soc_analyst"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SOC_DATABASE_URL: postgresql+psycopg://soc:soc_local_pw@localhost:5432/soc_analyst
      SOC_TEST_DATABASE_URL: postgresql+psycopg://soc:soc_local_pw@localhost:5432/soc_analyst

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy .

      - name: Verify migrations apply and reverse
        run: |
          alembic upgrade head
          alembic downgrade base

      - name: Test (pytest)
        run: pytest
