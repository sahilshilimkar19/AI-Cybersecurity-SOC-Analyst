[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-soc-analyst"
version = "0.1.0"
description = "Enterprise-grade Agentic AI Security Operations Center (SOC) Analyst — human-in-the-loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sahil Shilimkar" }]
keywords = ["soc", "cybersecurity", "agentic-ai", "incident-response"]

# Runtime dependencies. Additional dependencies are added by the sprint that
# first requires them.
dependencies = [
    # Sprint 1 — Bootstrap
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "structlog>=24.1",
    # Sprint 2 — Database + Models
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "minio>=7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

# ---------------------------------------------------------------------------
# Package discovery
# The monorepo uses a flat layout whose top-level folders mirror the
# architecture layers (EDS §10). Discovery is declared explicitly so
# setuptools does not fail on the flat multi-package layout.
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = [
    "config*",
    "backend*",
    "agents*",
    "graph*",
    "memory*",
    "rag*",
    "tools*",
    "services*",
    "models*",
    "integrations*",
]
exclude = ["tests*", "docs*", "deploy*", "scripts*", "prompts*", "frontend*"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "logs", "frontend", "backend/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]  # allow flexible test naming

[tool.ruff.lint.isort]
known-first-party = [
    "config", "backend", "agents", "graph", "memory",
    "rag", "tools", "services", "models", "integrations",
]

# ---------------------------------------------------------------------------
# Mypy — static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ['^\.venv/', '^logs/', '^frontend/', '^backend/db/migrations/']

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Third-party packages without bundled type stubs.
[[tool.mypy.overrides]]
module = ["minio.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["config", "models", "backend"]
omit = ["tests/*", "backend/db/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
